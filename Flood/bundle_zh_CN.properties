tutorial.guardian-settings = \uf129 [accent]游戏设置[]\
  \n\
  \n最大建筑上限: {0}\
  \n精英模式: {1}\
  \n\
  \n在[scarlet]精英模式[]下，你可以在有足够资源时在洪水上建造任何建筑！
tutorial.guardian-commands0 = \uf120 [accent]/build[]\
  \n\
  \n在你当前或指定位置生成支持的建筑。建筑限制每10分钟+1。\
  \n输入但不带参数以查看建筑列表和花费。
tutorial.guardian-commands1 = \uf120 [accent]/deposit[]\
  \n\
  \n花费洪水点数来释放洪水。数量受点数和游戏进度影响。
tutorial.guardian-commands2 = \uf120 [accent]/spawn[]\
  \n\
  \n花费洪水点数来生成单位\
  \n输入但不带参数以查看单位列表和花费。
tutorial.guardian-commands3 = \uf120 [accent]/area[]\
  \n\
  \n冻结一定范围内的洪水（3–10格）来免费建造。\
  \n一次只能冻结一个区域。再次使用该质量以解冻。
tutorial.guardian-commands4 = \ue815 [accent]/resign[]\
  \n\
  \n将你从守卫的位置移除。如果可能的话，另一名玩家将接替该位置\
  \n该操作无法撤消！
