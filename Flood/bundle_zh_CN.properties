# Tutorial entries
tutorial.welcome.title = 欢迎!
tutorial.welcome = [lightgray]欢迎来到[accent]交互式教程菜单[]！\
  \n请 [accent]选择 内容子类[] 你会喜欢下面那些按钮的！
tutorial.reminder.title = 你好！
tutorial.reminder = [accent]你好！\
  \n\
  \n[lightgray]看起来你在这玩了一会。\
  \n考虑到你可能需要花 [white]几分钟[] 看看教程来改善你的体验！
tutorial.guardian.title = 守卫教程
tutorial.guardian = [accent]欢迎!\
  \n\
  \n[lightgray]看来你被选为守卫，简单来说你的任务是:\
  \n[accent]>[] 帮助洪水攻击玩家队伍\
  \n[accent]>[] 在洪水里造些额外的陷阱和建筑\
  \n[accent]>[] 使用(/tutorial)指令和服务器交互！\
  \n\
  \n如果你不想当洪水守卫，使用 /resign 指令来返回玩家队伍！\
  \n祝你好运！

tutorial.intro0 = [blue]\ue83b 洪水[] 是一个进攻风格的模式。要想胜利，你必须 [salmon]遏止[]所有\
  \n[]\uf867 [gold]水源[]以及[red]摧毁[]所有 \uf727 [gold]蓄能水源。
tutorial.intro1 = \uf867 [gold]水源[]产生[blue]洪水[]，[red]伤害[]所有附近和其中的建筑和单位。
tutorial.intro2 = 你可以通过持续造成[red]伤害[]来[salmon]遏止[]\uf867 [gold]水源[] \
  \n\
  \n当\uf867 [gold]水源[]被完全遏止时，你可以令其[salmon]无效化[]，通过在附近充能一个\
  \n\uf871 [accent]冲击反应堆[]或 \uf689 [accent]光辉[]来令其。
tutorial.intro3 = 一些帮你生存的提示：\
  \n\
  \n\uf898[accent]力墙投影[]可以非常有效的反抗洪水.\
  \n\uf8ae[accent]造墙[]是游戏早期非常有效的进攻防御手段.\
  \n\uf7fa[accent]反洪水[]在推进和遏止水源方面非常强大.
tutorial.intro4 = 强烈推荐你安装[blue]Floodcompat[]模组，在游戏自带[accent]模组浏览器[]中。避免服务器异步问题，并有可能减少延迟。
tutorial.intro5 = 在洪水中有许多[pink]特性[]。\
  \n你可以在教程菜单的其他子目录里了解更多！

tutorial.content0 = \uf867 [red]水源[]\
  \n\
  \n[accent]塞普罗核心[]作为水源。可以通过持续的[red]伤害[]或[cyan]反洪水[]来遏止。\
  \n需要[salmon]遏止所有水源[]来获胜。\
  \n\
  \n[red]无效化[]是可选项，但很有用。
tutorial.content1 = \uf727 [red]蓄能水源[]\
  \n\
  \n[accent]埃里克尔核心[]和[accent]发射台[]在释放大量[blue]洪水[]前必须充能。\
  \n当它正在释放洪水或者被大量[blue]洪水[]包围时，会获得[accent]免疫[]。\
  \n使用[cyan]反洪水[]会破坏免疫并造成额外伤害。
tutorial.content2 = \uf872 [red]孢子发射器[]\
  \n\
  \n[accent]钍反应堆[]会发射长距离[purple]孢子[]，在碰撞时释放[blue]洪水[].\
  \n抵御[purple]孢子[]，可通过下列建筑：\
  \n\uf80e [accent]裂解[]\
  \n\uf898 [accent]力墙投影[]\
  \n\uf682 [accent]震爆塔[]\
  \n\uf7aa [accent]单位力墙场[]
tutorial.content3 = \uf88b [red]洪水质量驱动器[]\
  \n\
  \n[accent]质量驱动器[]会收集并且长距离转移[blue]洪水[]。
tutorial.content4 = \uf6ad [red]洪水雷达[]\
  \n\
  \n[accent]雷达[]在短暂充能后瞄准生命值最高的单位。\
  \n伤害比例也随洪水倍率影响。
tutorial.content5 = \uf682 [red]洪水投影器[]\
  \n\
  \n[accent]震爆塔[]对附近的建筑附近释放[blue]洪水[]。
tutorial.content6 = \uf7fa [red]爬行者单位[]\
  \n\
  \n[accent]爬虫家族单位[]在接触到建筑时自爆并且释放[blue]洪水[]。\
  \n[orange]高等级[]单位会释放更多洪水。
tutorial.content7 = [cyan]反洪水[]\
  \n\
  \n玩家可以通过[cyan]反洪水[]来暂时阻止一定区域内的[blue]洪水[]。\
  \n\uf897 [accent]脉冲地雷[] - [sky]小[] 范围 [sky]短[] 时间.\
  \n\uf7fa [accent]爬虫[] - [sky]中等[] 范围 [sky]中等[] 时间.\
  \n\uf687[accent]创伤[] - [sky]大[] 范围 [sky]长[] 时间.\
  \n\
  \n[crimson]⚠ 警告：[cyan]反洪水[red]不会[white]消除范围内存在的洪水！
tutorial.content8 = \uf7aa[green]单位力墙场[]\
  \n\
  \n\uf7fb [gold]耀星[]和 \uf7c2 [gold]要塞[]的力墙场，会[red]伤害[][blue]洪水[]，但这也会 [red]伤害[]单位的力墙场。\
  \n不要太深入洪水！
tutorial.content9 = \uf898 [green]力墙投影[]\
  \n\
  \n[gold]力墙投影[]只会减缓[blue]洪水[]的扩散，不会造成伤害。\
  \n\
  \n[stat]备注：[][gold]力墙投影[]接触到[blue]洪水[]时会立即被破坏。
tutorial.content10 = \uf6ad [green]雷达[]\
  \n\
  \n如果放置在[accent]容器[]或[stat]核心[]旁, 那么[gold]雷达[]将会挖掘[blue]洪水[]生成资源.\
  \n不同的[blue]洪水深度[]给予不同的资源.\
  \n建造数量存在[accent]限制[].\
  \n使用[slate]/radarinfo[]查看详情.
tutorial.content11 = \uf866 [green]宝藏[]\
  \n\
  \n会有一些[gold]宝藏[] 藏在 [blue]洪水[]里, 它含有各种资源.\
  \n占领[gold]宝藏[]来获得其中资源.\
  \n\
  \n[scarlet]⚠ 确保不要破坏它[], [gold]宝藏[]其中的资源[red]将会[crimson]消失.

tutorial.additions0 = \uf7e4 [pink]逻辑[]\
  \n\
  \n一些限制已加入[accent]逻辑[]来平衡游戏体验。处理器无法控制单位。
tutorial.additions1 = \ue84d [pink]洪水免疫[]\
  \n\
  \n\uf7f1 [accent]独影[][gold]免疫[][blue]洪水[]。
tutorial.additions2 = \uf899 [pink]超速[]\
  \n\
  \n[gold]超速投影 & 超速穹顶[]给予友方单位 \uf7ab [accent]超频[]效果。
tutorial.additions3 = \uf8ac [pink]可行走的墙[]\
  \n\
  \n小型\uf8a0 [accent]废料[]、 \uf8ac [accent]钛[]以及\
  \n\uf8a8 [accent]钍[]墙可以被单位通过。
tutorial.additions4 = \uf7e9 [pink]辅机[]\
  \n\
  \nEa每个[accent]核心[]会生成一个[gold]辅机[]，可以挖矿、协助以及攻击.

tutorial.modes0 = [sky]\ue861 洪水 PvP[]\
  \n\
  \nPvP但是被扭曲了！包含特性：\
  \n- 游戏开始有基于核心的pvp保护\
  \n- 高等级爬虫单位会对敌方建筑释放洪水。
tutorial.modes1 = [sky]\ue86e 洪水守卫[]\
  \n\
  \n一个随机选择的玩家将会加入[blue]洪水[]队伍并获得特殊能力，以帮助洪水胜利。
tutorial.modes2 = [sky]\ue82d 重新拼凑地图[]\
  \n\
  \n地图里的矿物、墙壁和地板将会随机重新生成！\
  \n有些地图将会在开局和定期随机多次重新生成。\
  \n\
  \n你可以使用[slate]/scramble[]指令发起投票来随机重新生成地图.

