# Tutorial entries
tutorial.welcome.title = 欢迎!
tutorial.welcome = [lightgray]W欢迎来到[accent]交互式教程菜单[]!\
  \n请使用下面的按钮选择你想看的[accent]内容子类[]!
tutorial.forced.title = 哦, 好吧...
tutorial.forced = [accent]嘿!\
    \n\n[lightgray]看起来你还没有读过教程, 让我(强制)给你看看, 好吗?
tutorial.reminder.title = 嗨!
tutorial.reminder = [accent]嘿!\
    \n\n[lightgray]看起来你在这里玩了有一段时间了.\
    \n请考虑花[white]1分钟[]的时间来快速读一下教程, 来改善你在这儿的游戏体验。

tutorial.intro0 = 在[orange] 塔防[]中, 敌对单位无法射击并有着[stat]固定的路径[].\
    \n\n一旦它们到达了  [stat]核心[], 它们就会伤害  [stat]核心[].
tutorial.intro1 = [stat]敌对单位[] 在[red]死亡[]时会掉落资源.\
    \n\n[red]除此之外没有为[]  [stat]核心[]获取资源的其他方法.
tutorial.intro2 = 某些游戏机制与\
    \n[orange] 塔防[]\
    \n\n[stat] 敌对单位[]不冲突[].\
    \n[#ff6f]开火[]不会对建筑造成[scarlet]伤害[].\
    \n [stat]核心[] 在死亡时不会[red]爆炸[] .
tutorial.intro3 = 还有[stat] 升级商店[], 你可以在那里为你的团队购买升级.\
    \n你可以使用[slate]/shop[]访问.

tutorial.content0 =  [gold]独影祭献[]\
    \n\n[stat]独影[]会环绕 [stat]核心[]并且会祭献自身来治疗核心.\
    \n\n[red]这是唯一治疗核心的方法.
tutorial.content1 =  &  [gold]电场[]\
    \n\n[accent]修理器[]会伤害并减速敌人.\
    \n\n[red]不会治疗核心.
tutorial.content2 =  [gold]削弱投影[]\
    \n\n[accent]力墙投影[]会减速敌人并使其受到更多伤害.
tutorial.content3 =  &  [gold]超频炮塔[]\
    \n\n[stat]维修点[]会对范围内的友方应用 [stat]超频[]状态.\
    \n不再需要电力.
tutorial.content4 =  [gold]子弹增幅[]\
    \n\n[stat]裂解[]会增加范围内子弹的伤害[yellow]{0}x[].\
    \n不再需要电力.
tutorial.content5 =  [gold]&[] [gold]护盾破坏[]\
    \n\n[stat]厄兆[]会对敌对单位的[tan]护盾[]造成[yellow]{0}k[]伤害.\
    \n[stat]海神[]会对敌对单位的 [tan]护盾[]造成[yellow]{1}k[]伤害.
tutorial.content6 =  [gold]重型支援[]\
    \n\n[stat]要塞[]会减速敌人并对其施加 [olive]腐蚀[]状态.\
    \n[stat]要塞[]会对友方单位施加 [stat]过载[]和\
    \n[red]Boss[]（守卫）效果.
tutorial.content7 =  [gold]区域制热[]\
    \n\n[stat]再生投影器[]会对范围内的敌人施加 [goldenrod]燃烧[]和 [#ff6f]熔化[]效果.\
    \n需要 [cyan]{0}[] [cyan]氢气/秒[].\
    \n[stat]相织布[]会增加伤害.
tutorial.content8 =  [gold]单位雷达[]\
    \n\n[stat]雷达[]会将进入范围内的第一个敌人转化为你的团队的友方单位.\
    \n冷却时间[cyan]{0}分钟[].\
    \n同时只能存在[cyan]{1}[]个.
tutorial.content9 =  [gold]相织布塔[]\
    \n\n[stat]震爆塔[]会对至多[cyan]{0}[]个目标发射光束.\
    \n每个光束以[cyan]{1}dps[]开始, 最终能达到[cyan]{2}dps[].\
    \n需要[cyan]{3}[] [cyan]氰气/秒[].